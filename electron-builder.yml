# App de uso diario (05-arquitectura.md › Despliegue): una carpeta con el ejecutable y un acceso directo, como
# otra app. Se arma con `pnpm dist` en `release/win-unpacked/`; una versión nueva se arma encima.
appId: com.lautaro.iridium
productName: Iridium
directories:
  output: release
  buildResources: build
files:
  - out/**
  - '!out/extension/**'
  - '!out/plugins/**'
  - package.json
# La extensión de la Revisión va suelta: Iridium la copia a su carpeta fija al arrancar. El ayudante que pone la
# versión nueva al cerrar (CO-I2) también: Iridium lo copia a la carpeta temporal y lo lanza.
extraResources:
  - from: out/extension
    to: extension
  - from: tools/cambiar-version.ps1
    to: cambiar-version.ps1
  # Los complementos de las conversaciones (D-086): la skill de Iridium y la guía de hitos.
  - from: out/plugins
    to: plugins
asar: true
# El SDK trae su propio Claude Code (claude.exe): tiene que quedar fuera del archivo comprimido para poder
# ejecutarse (riesgo de la arquitectura probado en I-1).
asarUnpack:
  - node_modules/@anthropic-ai/**
# Los «fusibles» de Electron (Defecto 6, D-076): el programa armado no corre como Node (ELECTRON_RUN_AS_NODE) ni
# lee NODE_OPTIONS, así otro programa de la PC no puede usar Iridium para correr su código; y solo carga la app de
# su `app.asar`. `--inspect` queda: con él Playwright y las herramientas de `tools/` manejan la app armada.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  onlyLoadAppFromAsar: true
# Los textos de Chromium (menús del sistema, diálogos) solo en español y el inglés de reserva: los otros 52 idiomas
# pesaban 45 MB en cada versión publicada (D-161).
electronLanguages:
  - es
  - es-419
  - en-US
# Usa el Electron ya instalado (no descarga otro).
electronDist: node_modules/electron/dist
win:
  target:
    - target: dir
      arch: x64
  icon: build/icon.png
  signAndEditExecutable: true
# El instalador de las copias compartidas (D-171): lo arma `pnpm publicar` desde la app ya armada (`--prepackaged`,
# `--win nsis`); el armado de todos los días sigue siendo la carpeta de arriba. Un doble clic instala para el usuario,
# sin pedir permisos, en %LOCALAPPDATA%\Programs\iridium, con acceso en el escritorio y en el menú Inicio; los datos de
# Iridium (%APPDATA%\Centro de Desarrollo) no se tocan. `store-asar`: el app.asar va guardado tal cual y lo demás sin
# comprimir junto, así una versión nueva baja solo lo que cambió (el .blockmap).
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  artifactName: Iridium-Setup-${version}.${ext}
  shortcutName: Iridium
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  differentialPackage: store-asar
