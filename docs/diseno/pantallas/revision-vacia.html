<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisión sin comentarios</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../piezas.css">
</head>
<body data-marco="proyecto" data-seccion="revision">
<main class="seccion">
  <header class="cabecera">
    <div class="fila-cab"><h1>Revisión</h1></div>
    <div class="filtros"><button class="filtro elegido">Nuevos <span class="cuenta">0</span></button><button class="filtro">Anotados <span class="cuenta">0</span></button><button class="filtro">Hechos <span class="cuenta">0</span></button><button class="filtro">Todos <span class="cuenta">0</span></button></div>
  </header>
  <div class="contenido centrado">
    <div class="recuadro vacio">
      <strong>Sin comentarios</strong>
      <span>Con <b>F8</b> prendés el modo comentar: tocás cualquier cosa de la pantalla, escribís qué cambiarías y queda acá con su captura.</span>
      <span>Lo mandás a la IA cuando quieras, uno por uno o todos juntos.</span>
    </div>
  </div>
</main>
<script src="../piezas.js"></script>
</body>
</html>
