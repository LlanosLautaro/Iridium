<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo proyecto</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../piezas.css">
<style>
  .fondo-grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--esp-3); }
  .fondo-grilla span { height: 168px; border-radius: var(--radio-tarjeta); background: var(--tarjeta); }
  .cuadro .ruta-nueva { font-size: var(--tam-chico); color: var(--texto-3); }
</style>
</head>
<body data-marco="inicio" data-seccion="grilla">
<main class="seccion">
  <header class="cabecera">
    <div class="fila-cab"><h1>Proyectos <span class="cuenta">10</span></h1><span class="ruta">D:\Proyectos</span>
      <span class="acciones-cab"><button class="boton principal"><i data-ic="mas"></i>Nuevo proyecto</button></span></div>
  </header>
  <div class="contenido"><div class="fondo-grilla"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
  <div class="velo" id="velo-nuevo">
    <form class="cuadro" onsubmit="return false">
      <h2>Nuevo proyecto</h2>
      <p>Arma la carpeta con la plantilla del framework. Después le contás a su IA qué querés hacer.</p>
      <label class="etiqueta-campo">Nombre<input class="campo" id="nombre" placeholder="Por ejemplo, Lista de compras" autofocus oninput="document.getElementById('crear').disabled = !this.value.trim(); document.getElementById('ruta').textContent = 'D:\\Proyectos\\' + this.value.trim()"></label>
      <span class="ruta-nueva" id="ruta">D:\Proyectos\</span>
      <div class="pie"><a class="boton sin-fondo" href="grilla.html">Cancelar</a><button class="boton principal" id="crear" disabled>Crear</button></div>
    </form>
  </div>
</main>
<script src="../piezas.js"></script>
</body>
</html>
