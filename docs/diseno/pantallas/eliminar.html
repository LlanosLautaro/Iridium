<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Eliminar un proyecto</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../piezas.css">
<style>
  .fondo-grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--esp-3); }
  .fondo-grilla span { height: 150px; border-radius: var(--radio-tarjeta); border: 1px solid var(--borde); }
  /* Lo que se borra para siempre: una lista corta con el tamaño de cada cosa. */
  .regenerables { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--esp-1); }
  .regenerables li { display: flex; gap: var(--esp-3); font-size: var(--tam-chico); color: var(--texto-2); }
  .regenerables .tam { margin-left: auto; font-family: var(--mono); color: var(--texto-3); }
</style>
</head>
<body data-marco="inicio" data-seccion="grilla">
<main class="seccion">
  <header class="cabecera">
    <div class="fila-cab"><h1>Proyectos</h1>
      <span class="acciones-cab"><button class="boton principal"><i data-ic="mas"></i>Nuevo proyecto</button></span></div>
  </header>
  <div class="contenido"><div class="fondo-grilla"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
  <div class="velo">
    <div class="cuadro" role="alertdialog" aria-modal="true" aria-labelledby="eliminar-t">
      <h2 id="eliminar-t">¿Eliminar «Theta»?</h2>
      <p>La carpeta va a la papelera de Windows (1.284 archivos, con su historial de Git): desde ahí se puede recuperar.</p>
      <p>Se borra para siempre lo que se vuelve a generar:</p>
      <ul class="regenerables">
        <li><code>node_modules</code><span class="tam">412 MB</span></li>
        <li><code>out</code><span class="tam">38 MB</span></li>
        <li><code>release</code><span class="tam">161 MB</span></li>
      </ul>
      <div class="pie"><a class="boton sin-fondo" href="grilla.html">Cancelar</a><a class="boton principal peligroso" href="grilla.html">Eliminar «Theta»</a></div>
    </div>
  </div>
</main>
<script src="../piezas.js"></script>
</body>
</html>
