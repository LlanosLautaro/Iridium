<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frentes · B · Camino</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../piezas.css">
<style>
  /* Lo del tablero (las tarjetas, la cabecera del frente y sus preguntas), igual en A y B, con prefijo fs-. */
  .fs-dos { display: grid; grid-template-columns: var(--ancho-frentes) minmax(0, 1fr); height: 100%; }
  .fs-dos > nav { border-right: 1px solid var(--borde-suave); padding: var(--esp-4) var(--esp-2); overflow: auto; }
  .fs-dos > nav > .bloque { margin-top: var(--esp-5); }
  .fs-dos > nav .bloque-titulo { padding: 0 var(--esp-2); }
  .fs-dos > article { overflow: auto; padding: var(--esp-5) var(--esp-6) var(--esp-7); }
  .fs-tarjeta { width: 100%; background: none; border: 0; text-align: left; font: var(--estilo-cuerpo); cursor: pointer; }
  .fs-tarjeta .fs-marcas { display: flex; gap: var(--esp-2); align-items: center; align-self: flex-start; padding-top: 2px; }
  .fs-tarjeta.archivado .titulo-fila { color: var(--texto-3); }
  .fs-cab { display: flex; align-items: baseline; gap: var(--esp-3); margin-bottom: var(--esp-5); }
  .fs-cab h2 { margin: 0; font: var(--estilo-titulo); }
  .fs-cab .derecha { margin-left: auto; }
  .fs-preguntas { margin-bottom: var(--esp-6); }

  /* B: el camino de hoy (la pieza Camino, PZ-15), con el tamaño y «sola» en cada paso que viene. */
  .fs-recorrido .texto-tramo > .fs-pie { margin-left: auto; display: inline-flex; gap: var(--esp-3); align-items: center; font: var(--estilo-meta); color: var(--texto-3); white-space: nowrap; }
  .fs-recorrido .fs-pie .codigo { font: var(--estilo-codigo); }
  .fs-recorrido .texto-tramo a.senal { cursor: pointer; text-decoration: none; }
  .fs-gris { margin: var(--esp-3) 0 0 var(--esp-6); color: var(--texto-3); font: var(--estilo-cuerpo); }
</style>
</head>
<body data-marco="proyecto" data-seccion="mapa">
<main class="seccion">
  <header class="cabecera">
    <div class="fila-cab"><h1>Frentes</h1><span class="ruta">Hito 10 · Operación</span>
      <span class="acciones-cab"><label class="interruptor"><input type="checkbox" id="ver-archivados"><span>Archivados <span class="cuenta">5</span></span></label></span></div>
  </header>
  <div class="contenido sin-margen">
    <div class="fs-dos">
      <nav id="tarjetas" aria-label="Frentes"></nav>
      <article id="frente"></article>
    </div>
  </div>
</main>
<script src="../piezas.js"></script>
<script src="frentes.js"></script>
<script>
  function senalB(p) {
    if (p.e === 'tuya') return `<a class="senal ambar" href="bandeja.html" title="Abrir ${p.q} en la Bandeja">Te espera · ${p.q}</a>`
    if (p.e === 'pausa') return '<span class="senal ambar">En pausa</span>'
    return p.sola ? `<span class="senal">${icono('robot')}sola</span>` : ''
  }

  function tramo(clase, carril1, carril2, html, pie = '') {
    const d = document.createElement('div')
    d.className = `tramo ${clase}`
    const principal = clase.includes('principal')
    d.innerHTML = `<div class="carril ${carril1}">${principal ? '<span class="punto-camino"></span>' : ''}</div>` +
      (principal ? '' : `<div class="carril ${carril2}"><span class="punto-camino"></span></div>`) +
      `<div class="texto-tramo">${html}${pie ? `<span class="fs-pie">${pie}</span>` : ''}</div>`
    return d
  }

  window.recorrido = (f, zona, abierto = false) => {
    zona.innerHTML = '<div class="camino"></div>'
    const camino = zona.firstChild
    const s = sigue(f)
    const ultimoHecho = f.pasos.map((p) => p.e).lastIndexOf('hecho')
    const desde = abierto ? 0 : Math.max(0, ultimoHecho)
    const ultimo = f.pasos.length - 1
    if (desde) {
      const pl = tramo('principal hecho plegado', 'abajo', '', `<button class="nombre-tramo">${f.pasos.slice(0, desde).filter((p) => p.e === 'hecho').length} ${f.pasos.slice(0, desde).filter((p) => p.e === 'hecho').length === 1 ? 'hecho' : 'hechos'} antes</button>`)
      pl.querySelector('.punto-camino').textContent = '+'
      pl.addEventListener('click', () => window.recorrido(f, zona, true))
      camino.append(pl)
    }
    const conLinea = camino.children.length > 0
    // Las ramas (rama: true) cuelgan del último paso principal de arriba.
    let padre = -1
    f.pasos.forEach((p, i) => {
      if (i < desde) return
      const clase = p === s && !p.e ? 'foco' : p.e === 'tuya' ? 'espera' : p.e ?? ''
      const pie = [p.cod ? `<span class="codigo">${p.cod}</span>` : '', p.tam && !p.e ? `<span>${p.tam}</span>` : '', senalB(p)].join('')
      const nombre = `<span class="nombre-tramo">${p.t}</span>`
      if (!p.rama) {
        padre = i
        const siguePrincipal = f.pasos.slice(i + 1).some((o) => !o.rama)
        camino.append(tramo(`principal ${clase}`, `${i > desde || conLinea ? 'arriba' : ''} ${siguePrincipal ? 'abajo' : ''}`, '', nombre, pie))
      } else {
        const primera = !f.pasos[i - 1]?.rama
        const otra = f.pasos[i + 1]?.rama
        const siguePrincipal = f.pasos.slice(i + 1).some((o) => !o.rama)
        camino.append(tramo(`rama ${clase}`, siguePrincipal ? 'sigue' : '', `${primera ? 'codo' : 'arriba'} ${otra ? 'abajo' : ''}`, nombre, pie))
      }
    })
    if (!f.pasos.some(pendiente)) zona.insertAdjacentHTML('beforeend', '<p class="fs-gris">Todo hecho por ahora.</p>')
  }

  armarTablero()
</script>
</body>
</html>
