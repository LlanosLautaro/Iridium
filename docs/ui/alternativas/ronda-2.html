<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ronda 2 de estilo</title>
<style>
:root { color-scheme: dark; --fondo: #08090a; --texto: #e2e6e4; --texto-2: #9aa4a0; --borde: #23282a; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px 28px 40px; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
p.sub { color: var(--texto-2); margin-bottom: 20px; }
.grilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
figure { border: 1px solid var(--borde); }
.marco { position: relative; aspect-ratio: 1440 / 900; overflow: hidden; }
.marco iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--borde); }
figcaption b { font-weight: 600; }
figcaption span { color: var(--texto-2); font-size: 13px; }
a { color: #6fe3cf; }
</style>
</head>
<body>
<h1>Ronda 2: la síntesis (D) con la letra de B</h1>
<p class="sub">Las cuatro parten de D y usan Chakra Petch (la letra de B) para leer. La ronda 1 está en <a href="ronda-1.html">ronda-1.html</a>; la ronda 3, en <a href="index.html">index.html</a>. Abrí cada una para tocarla: el botón de panel (o Ctrl+B) despliega el mapa.</p>
<div class="grilla">
  <figure><div class="marco"><iframe src="e1-sintesis-legible.html?panel&sinaviso" title="E1 · Síntesis legible"></iframe></div><figcaption><b>E1 · Síntesis legible</b><span>D tal cual, con la letra de B · <a href="e1-sintesis-legible.html">abrir</a></span></figcaption></figure>
  <figure><div class="marco"><iframe src="e2-verde-de-mando.html?panel&sinaviso" title="E2 · Verde de mando"></iframe></div><figcaption><b>E2 · Verde de mando</b><span>+ el verde azulado y los botones de contorno de B · <a href="e2-verde-de-mando.html">abrir</a></span></figcaption></figure>
  <figure><div class="marco"><iframe src="e3-paneles-suaves.html?panel&sinaviso" title="E3 · Paneles suaves"></iframe></div><figcaption><b>E3 · Paneles suaves</b><span>+ esquinas redondeadas, brillo y medidores de B · <a href="e3-paneles-suaves.html">abrir</a></span></figcaption></figure>
  <figure><div class="marco"><iframe src="e4-calma.html?panel&sinaviso" title="E4 · Calma"></iframe></div><figcaption><b>E4 · Calma</b><span>+ menos mayúsculas y menos monoespaciada · <a href="e4-calma.html">abrir</a></span></figcaption></figure>
</div>
<script>
function escalar() { document.querySelectorAll(".marco").forEach(m => m.querySelector("iframe").style.transform = `scale(${m.clientWidth / 1440})`); }
addEventListener("resize", escalar); escalar();
</script>
</body>
</html>
