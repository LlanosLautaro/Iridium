<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista de proyecto</title>
<!-- D-041: tres paneles (secciones del proyecto · vista principal · conversación) y barra de título propia. -->
<link rel="stylesheet" href="tokens.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--fondo); color: var(--texto); font: 400 var(--tam-base)/1.5 var(--ui); font-variant-numeric: tabular-nums; min-width: 1024px; overflow: hidden; }
::selection { background: var(--seleccion); color: var(--texto); }
:focus-visible { outline: 1px solid var(--primario); outline-offset: -1px; }
* { scrollbar-width: thin; scrollbar-color: var(--borde-fuerte) transparent; }
button, select { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
code, .cod { font-family: var(--mono); font-size: 12.5px; color: var(--texto-2); }
[hidden] { display: none !important; }

/* Marco: barra de título propia arriba, barra de íconos, vista principal, divisor y conversación */
.app { --ancho-chat: 440px; display: grid; grid-template-columns: 48px minmax(360px, 1fr) 5px var(--ancho-chat); grid-template-rows: 36px 1fr 26px; height: 100vh; }
.app.sin-chat { grid-template-columns: 48px 1fr 0 0; }
.app.sin-chat .divisor, .app.sin-chat .chat { display: none; }

.titulo { grid-column: 1 / -1; display: flex; align-items: stretch; background: var(--barra); border-bottom: 1px solid var(--borde); -webkit-app-region: drag; }
.titulo button { -webkit-app-region: no-drag; }
.inicio { position: relative; width: 48px; display: grid; place-items: center; color: var(--primario); border-right: 1px solid var(--borde); }
.inicio:hover { background: var(--hover); }
.inicio.activo { background: var(--fondo); }
.inicio .ic { width: 19px; height: 19px; }
.badge { position: absolute; right: 5px; bottom: 4px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; border-radius: var(--radio-control); background: var(--espera); color: var(--sobre-color); font: 700 10.5px/1 var(--mono); }
.ses { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-right: 1px solid var(--borde); color: var(--texto-3); white-space: nowrap; position: relative; -webkit-app-region: no-drag; cursor: pointer; }
.ses:hover { color: var(--texto-2); background: var(--hover); }
.ses.activa { background: var(--fondo); color: var(--texto); }
.ses.activa::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--primario); }
.ses .nom { font-weight: 600; }
.ses .cerrar { width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--radio-control); color: var(--texto-3); }
.ses .cerrar .ic { width: 12px; height: 12px; }
.ses .cerrar:hover { color: var(--texto); background: var(--hover); }
.punto { width: 7px; height: 7px; border-radius: 50%; background: var(--texto-3); }
.punto.trab { background: var(--trabaja); box-shadow: 0 0 0 3px color-mix(in oklab, var(--trabaja) 18%, transparent); }
.punto.espera { background: var(--espera); }
.titulo .relleno { flex: 1; }
.ventana { display: flex; align-items: stretch; -webkit-app-region: no-drag; }
.ventana span { width: 46px; display: grid; place-items: center; color: var(--texto-3); }
.ventana span:hover { background: var(--hover); color: var(--texto); }
.ventana span:last-child:hover { background: #c42b1c; color: #fff; }
.ventana .ic { width: 13px; height: 13px; stroke-width: 1.2; }

.actividad { background: var(--lateral); border-right: 1px solid var(--borde); display: flex; flex-direction: column; align-items: center; padding: 4px 0 6px; }
.act { position: relative; width: 48px; height: 44px; display: grid; place-items: center; color: var(--texto-3); }
.act .ic { width: 20px; height: 20px; }
.act:hover { color: var(--texto); }
.act.activo { color: var(--primario); }
.act.activo::before { content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 2px; background: var(--primario); }
.act .badge { right: 7px; bottom: 7px; }
.act.abajo { margin-top: auto; }
.act .tip { position: absolute; left: 52px; top: 50%; translate: 0 -50%; padding: 3px 8px; background: var(--elevado); border: 1px solid var(--borde-fuerte); border-radius: var(--radio-control); color: var(--texto); font-size: var(--tam-chico); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.act:hover .tip { opacity: 1; transition-delay: .35s; }

.principal { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cabecera { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px 0 20px; border-bottom: 1px solid var(--borde); flex: none; min-width: 0; }
.cabecera h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
.cabecera .sub { color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cabecera .der { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid color-mix(in oklab, currentColor 45%, transparent); border-radius: var(--radio-control); font: 600 var(--tam-chico)/1 var(--ui); letter-spacing: .02em; white-space: nowrap; }
.chip .ic { width: 12px; height: 12px; }
.chip.espera { color: var(--espera); }
.chip.ok { color: var(--ok); }
.chip.neutro { color: var(--texto-3); }
.vista { flex: 1; min-height: 0; overflow: auto; }

.divisor { cursor: col-resize; background: var(--fondo); border-left: 1px solid var(--borde); position: relative; }
.divisor:hover, .divisor.arrastra { background: color-mix(in oklab, var(--primario) 25%, var(--fondo)); }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 1px solid var(--borde-control); border-radius: var(--radio-control); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn .ic { width: 14px; height: 14px; }
.btn.chico { height: 26px; padding: 0 9px; }
.btn.icono { width: 28px; padding: 0; justify-content: center; border-color: transparent; color: var(--texto-2); }
.btn.icono:hover { color: var(--texto); }
.btn.icono.abierto { background: var(--hover); color: var(--texto); }
.btn.sigue { border-color: color-mix(in oklab, var(--primario) 55%, transparent); color: var(--primario-texto); }

/* Conversación */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--fondo); position: relative; }
.chat-cab { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--borde); flex: none; }
.chat-cab .tit { min-width: 0; flex: 1; line-height: 1.25; }
.chat-cab .tit b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-cab .tit small { display: block; color: var(--texto-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mensajes { flex: 1; overflow: auto; padding: 14px 18px 8px; }
.msg { margin-bottom: 14px; }
.msg .quien { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--texto-3); margin-bottom: 2px; }
.msg .quien.ia { color: var(--primario-texto); }
.msg p { font-size: var(--tam-lectura); line-height: 1.55; margin-bottom: 6px; }
.herr { display: flex; align-items: center; gap: 6px; color: var(--texto-3); font-size: var(--tam-chico); margin: 2px 0 8px; }
.herr .ic { width: 12px; height: 12px; }
.qs { border: 1px solid var(--espera-borde); background: var(--espera-fondo); border-radius: var(--radio-bloque); padding: 10px 12px; margin: 6px 0 4px; }
.qs .encab { display: flex; align-items: center; gap: 6px; color: var(--espera); font-weight: 600; margin-bottom: 6px; }
.qs .encab .ic { width: 14px; height: 14px; }
.qs .q { display: flex; align-items: center; gap: 8px; }
.qs .q span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.responder { background: var(--espera); border-color: var(--espera); color: var(--sobre-color); }
.btn.responder:hover { background: color-mix(in oklab, var(--espera) 88%, white); }
.escribir { margin: 6px 14px 14px; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-bloque); background: var(--caja); padding: 10px 12px 8px; flex: none; }
.escribir .campo { color: var(--texto-3); min-height: 38px; }
.escribir .campo::before { content: "> "; color: var(--primario); font-family: var(--mono); }
.escribir .pie { display: flex; align-items: center; gap: 8px; color: var(--texto-3); font-size: 12px; }
.escribir .pie .ic { margin-left: auto; }
.historial { position: absolute; top: 44px; left: 10px; right: 10px; z-index: 10; background: var(--elevado); border: 1px solid var(--borde-fuerte); border-radius: var(--radio-bloque); box-shadow: 0 12px 32px #0008; padding: 6px; }
.historial h3 { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-3); padding: 6px 8px 4px; font-weight: 600; }
.conv { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; width: 100%; text-align: left; padding: 7px 8px; border-radius: var(--radio-fila); }
.conv:hover { background: var(--hover); }
.conv.actual { background: var(--sel-fondo); }
.conv b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv time { font-family: var(--mono); font-size: 12px; color: var(--texto-3); }
.conv small { grid-column: 1 / -1; color: var(--texto-3); font-size: 12px; }

/* Mapa (D-035) */
.mapa { max-width: 860px; margin: 0 auto; padding: 22px 28px 40px; }
.hitos { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-bottom: 6px; }
.casilla { height: 30px; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-control); display: grid; place-items: center; font: 600 12px/1 var(--mono); color: var(--texto-3); }
.casilla.hecho { background: color-mix(in oklab, var(--ok) 10%, var(--fondo)); color: var(--texto-2); border-color: color-mix(in oklab, var(--ok) 25%, var(--borde)); }
.casilla.actual { border-color: var(--primario); color: var(--primario-texto); }
.cuenta { color: var(--texto-3); font-size: var(--tam-chico); margin-bottom: 18px; }
.tarjeta { border: 1px solid var(--borde); background: var(--caja); border-radius: var(--radio-tarjeta); padding: 18px 20px; }
.tarjeta h2 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
.tarjeta .meta { color: var(--texto-3); margin-bottom: 14px; }
.bloque { margin-top: 16px; }
.bloque h3 { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-3); font-weight: 600; margin-bottom: 6px; }
.bloque p { color: var(--texto-2); }
.pasos { list-style: none; padding: 0; display: grid; gap: 3px; }
.pasos li { display: flex; align-items: center; gap: 8px; color: var(--texto-2); }
.pasos li .ic { width: 14px; height: 14px; color: var(--texto-3); }
.pasos li.ok .ic { color: var(--ok); }
.pasos li.esp .ic { color: var(--espera); }
.pasos li.cur { color: var(--texto); }
.pasos li.cur .ic { color: var(--primario); }
.espera-fila { display: flex; align-items: center; gap: 10px; border: 1px solid var(--espera-borde); background: var(--espera-fondo); border-radius: var(--radio-fila); padding: 8px 10px; }
.espera-fila .ic { color: var(--espera); }
.espera-fila span { flex: 1; }

/* Docs (lector liviano, D-035) */
.lector-barra { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--borde-suave); }
.menu { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-control); color: var(--texto-2); }
.menu .ic { width: 13px; height: 13px; rotate: 90deg; }
.hoja { max-width: 720px; margin: 0 auto; padding: 26px 28px 60px; font-size: var(--tam-lectura); line-height: 1.65; }
.hoja h1 { font-size: 22px; font-weight: 600; margin-bottom: 14px; }
.hoja h2 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
.hoja p, .hoja li { color: var(--texto-2); margin-bottom: 8px; }
.hoja ul { padding-left: 20px; }
.hoja a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
.hoja a:hover { color: var(--primario-texto); }
.hoja pre { font-family: var(--mono); font-size: 12.5px; background: var(--caja); border: 1px solid var(--borde); border-radius: var(--radio-bloque); padding: 10px 12px; color: var(--texto-2); overflow: auto; margin-bottom: 10px; }
.aviso-suave { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px dashed var(--borde-fuerte); border-radius: var(--radio-bloque); color: var(--texto-3); font-size: var(--tam-chico); margin-bottom: 18px; }

/* Archivos y Git: lista a la izquierda, lo elegido a la derecha */
.partida { display: grid; grid-template-columns: 260px 1fr; height: 100%; min-height: 0; }
.lista { border-right: 1px solid var(--borde); overflow: auto; padding: 6px 0 20px; background: color-mix(in oklab, var(--lateral) 50%, var(--fondo)); }
.lista h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3); font-weight: 600; padding: 10px 14px 4px; display: flex; justify-content: space-between; white-space: nowrap; }
.nodo { display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; padding: 0 10px 0 calc(10px + var(--n, 0) * 14px); text-align: left; color: var(--texto-2); white-space: nowrap; }
.nodo:hover { background: var(--hover); color: var(--texto); }
.nodo.sel { background: var(--sel-fondo); color: var(--texto); }
.nodo .ic { width: 14px; height: 14px; color: var(--texto-3); }
.nodo .chev { width: 12px; height: 12px; transition: rotate .15s var(--sale); }
.nodo[aria-expanded="true"] .chev { rotate: 90deg; }
.nodo .nombre { overflow: hidden; text-overflow: ellipsis; }
.nodo .mod { margin-left: auto; font: 600 12px/1 var(--mono); color: var(--espera); }
.visor { overflow: auto; min-width: 0; }
.visor-cab { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 16px; border-bottom: 1px solid var(--borde-suave); color: var(--texto-3); font-size: var(--tam-chico); position: sticky; top: 0; background: var(--fondo); }
.visor-cab .ruta { font-family: var(--mono); color: var(--texto-2); }
.visor-cab .der { margin-left: auto; }
.codigo { font: 12.5px/1.6 var(--mono); padding: 8px 0 30px; counter-reset: l; white-space: pre; }
.codigo div { padding: 0 16px 0 0; }
.codigo div::before { counter-increment: l; content: counter(l); display: inline-block; width: 44px; padding-right: 14px; text-align: right; color: var(--texto-3); opacity: .6; }
.codigo .c { color: var(--texto-3); }
.codigo .k { color: var(--primario-texto); }
.codigo .s { color: #c9b77a; }

.commit { display: block; width: 100%; text-align: left; padding: 7px 14px; border-left: 2px solid transparent; }
.commit:hover { background: var(--hover); }
.commit.sel { background: var(--sel-fondo); border-left-color: var(--primario); }
.commit b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.commit small { color: var(--texto-3); font-size: 12px; }
.commit small code { font-size: 12px; color: var(--texto-3); }
.rama { display: flex; align-items: center; gap: 6px; padding: 10px 14px 4px; color: var(--texto-2); }
.rama .ic { width: 14px; height: 14px; color: var(--texto-3); }
.git-det { padding: 16px 20px 40px; }
.git-det h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.git-det .meta { color: var(--texto-3); font-size: var(--tam-chico); margin-bottom: 14px; }
.git-det .meta code { font-size: 12px; }
.arch { border: 1px solid var(--borde); border-radius: var(--radio-bloque); margin-bottom: 8px; overflow: hidden; }
.arch > button { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 12px; background: var(--caja); text-align: left; }
.arch > button .ic { width: 12px; height: 12px; color: var(--texto-3); transition: rotate .15s var(--sale); }
.arch > button[aria-expanded="true"] .ic { rotate: 90deg; }
.arch > button .ruta { font-family: var(--mono); font-size: 12.5px; flex: 1; }
.arch .mas { color: var(--ok); font: 600 12px var(--mono); }
.arch .menos { color: var(--error); font: 600 12px var(--mono); }
.dif { font: 12.5px/1.6 var(--mono); white-space: pre; overflow: auto; border-top: 1px solid var(--borde); }
.dif div { padding: 0 12px; }
.dif .h { color: var(--texto-3); background: var(--caja); }
.dif .a { background: color-mix(in oklab, var(--ok) 11%, var(--fondo)); color: var(--texto); }
.dif .a::before { content: "+ "; color: var(--ok); }
.dif .b { background: color-mix(in oklab, var(--error) 11%, var(--fondo)); color: var(--texto); }
.dif .b::before { content: "− "; color: var(--error); }
.dif .n::before { content: "  "; }
.dif .n { color: var(--texto-2); }

/* Proyectos (grilla resumida; la completa es vista-proyectos.html) */
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 20px; }
.tarj { text-align: left; border: 1px solid var(--borde); background: var(--caja); border-radius: var(--radio-tarjeta); padding: 14px 16px; display: grid; grid-template-columns: 38px 1fr; gap: 4px 12px; }
.tarj:hover { border-color: var(--borde-fuerte); background: var(--hover); }
.tarj img { width: 38px; height: 38px; border-radius: var(--radio-bloque); grid-row: span 2; }
.tarj b { font-weight: 600; font-size: 14px; }
.tarj .est { color: var(--texto-2); font-size: var(--tam-chico); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tarj p { grid-column: 1 / -1; color: var(--texto-3); font-size: var(--tam-chico); margin-top: 8px; }
.vacia { display: grid; place-items: center; height: 100%; color: var(--texto-3); text-align: center; padding: 40px; }
.vacia b { display: block; color: var(--texto); font-size: 15px; margin-bottom: 6px; }

.estado-barra { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--barra); border-top: 1px solid var(--borde); color: var(--texto-3); font-size: 12px; }
.estado-barra .der { margin-left: auto; display: flex; gap: 14px; }
.estado-barra .num { font-family: var(--mono); color: var(--texto-2); }
</style>
</head>

      $("#vista").innerHTML = `<div class="grilla">${p.map(([img, n, e, h, q, s]) => `<button class="tarj" data-abrir="${s || ""}"><img src="iconos/${img}" alt=""><b>${n}</b><span class="est">${e}${q ? `<span class="chip espera">${ic("espera")}1 pregunta · frena</span>` : ""}</span><p>${h}</p></button>`).join("")}</div>`;
    } else {
      $("#cabecera").innerHTML = `<h1>Pendientes</h1><span class="sub">2 sin responder · 1 frena</span>`;
      $("#vista").innerHTML = `<div class="vacia"><div><b>Pendientes queda como hoy</b>La columna de proyectos y sus preguntas (ver <code>vista-pendientes.html</code>), ahora como sección del inicio.</div></div>`;
    }
    $("#estadoHito").textContent = "";
    return;
  }
  app.classList.remove("sin-chat");
  $("#cabecera").innerHTML = CAB_PROYECTO;
  $("#vista").innerHTML = VISTAS[estado.seccion]();
  $("#vista").scrollTop = 0;
  $("#estadoHito").textContent = "Hito 7 · Construcción";
}

document.addEventListener("click", (e) => {
  const t = e.target;
  const sec = t.closest("[data-sec]");
  if (sec) {
    if (estado.lugar === "proyecto") { estado.seccion = sec.dataset.sec; guardar("iridium-proto-seccion", estado.seccion); }
    else estado.general = sec.dataset.sec;
    return pintar();
  }
  if (t.closest("#inicio")) { estado.lugar = "general"; estado.general = estado.general || "proyectos"; return pintar(); }
  const ses = t.closest(".ses");
  if (ses && !t.closest(".cerrar")) { estado.lugar = "proyecto"; return pintar(); }
  if (t.closest("[data-abrir]")) { estado.lugar = "proyecto"; return pintar(); }
  const arch = t.closest("[data-archivo]");
  if (arch) { estado.archivo = arch.dataset.archivo; return pintar(); }
  const nodoCarpeta = t.closest(".nodo[aria-expanded]");
  if (nodoCarpeta) { nodoCarpeta.setAttribute("aria-expanded", nodoCarpeta.getAttribute("aria-expanded") !== "true"); return; }
  const com = t.closest("[data-commit]");
  if (com) { estado.commit = com.dataset.commit; return pintar(); }
  const a = t.closest(".arch > button");
  if (a) { const abrir = a.getAttribute("aria-expanded") !== "true"; document.querySelectorAll(".arch > button").forEach((b) => { b.setAttribute("aria-expanded", "false"); if (b.nextElementSibling) b.nextElementSibling.hidden = true; }); a.setAttribute("aria-expanded", abrir); const d = a.nextElementSibling; if (d) d.hidden = a.getAttribute("aria-expanded") !== "true"; return; }
  if (t.closest("#btnHistorial")) { const h = $("#historial"); h.hidden = !h.hidden; $("#btnHistorial").classList.toggle("abierto", !h.hidden); return; }
  const conv = t.closest(".conv");
  if (conv) { pintarChat(+conv.dataset.conv); $("#historial").hidden = true; $("#btnHistorial").classList.remove("abierto"); return; }
  if (t.closest("#btnNueva")) { $("#mensajes").innerHTML = ""; $("#chatTitulo").textContent = "Conversación nueva"; $("#chatSub").textContent = "En blanco: empieza con lo que escribas o con Seguí"; return; }
  if (!t.closest(".historial")) { $("#historial").hidden = true; $("#btnHistorial").classList.remove("abierto"); }
});

// Ancho de la conversación: se arrastra el divisor y se recuerda
const app = $("#app");
const ANCHO_ENTRADA = 440;
const fijarAncho = (px) => { const max = Math.max(320, window.innerWidth - 48 - 360 - 5); const v = Math.min(max, Math.max(320, px)); app.style.setProperty("--ancho-chat", v + "px"); return v; };
fijarAncho(+(leer("iridium-proto-chat") || ANCHO_ENTRADA));
const div = $("#divisor");
div.addEventListener("pointerdown", (e) => {
  div.setPointerCapture(e.pointerId); div.classList.add("arrastra");
  const mover = (ev) => guardar("iridium-proto-chat", fijarAncho(window.innerWidth - ev.clientX - 2));
  const soltar = () => { div.classList.remove("arrastra"); div.removeEventListener("pointermove", mover); div.removeEventListener("pointerup", soltar); };
  div.addEventListener("pointermove", mover); div.addEventListener("pointerup", soltar);
});
div.addEventListener("dblclick", () => guardar("iridium-proto-chat", fijarAncho(ANCHO_ENTRADA)));

const q = new URLSearchParams(location.search);
if (q.get("seccion")) estado.seccion = q.get("seccion");
if (q.get("inicio")) { estado.lugar = "general"; estado.general = q.get("inicio"); }
if (q.get("chat")) fijarAncho(+q.get("chat"));
pintarChat(0);
pintar();
if (q.get("historial")) { $("#historial").hidden = false; $("#btnHistorial").classList.add("abierto"); }
</script>
</body>
